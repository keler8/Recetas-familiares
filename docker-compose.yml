services:
  postgres:
    image: postgres:16-alpine
    container_name: recetario-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recetario_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recetario_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-recetario_db}
    volumes:
      - recetario_pgdata:/var/lib/postgresql/data
    networks:
      - recetario_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recetario_app} -d ${POSTGRES_DB:-recetario_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  redis:
    image: redis:7-alpine
    container_name: recetario-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - recetario_redisdata:/data
    networks:
      - recetario_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recetario-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data/storage:/app/data/storage
      - ./data/tmp:/app/data/tmp
      - ./data/backups:/app/data/backups
    networks:
      - recetario_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recetario-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data/storage:/app/data/storage
      - ./data/tmp:/app/data/tmp
      - ./data/backups:/app/data/backups
    networks:
      - recetario_net
    deploy:
      resources:
        limits:
          memory: 1536M

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recetario-scheduler
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    depends_on:
      worker:
        condition: service_started
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data/tmp:/app/data/tmp
    networks:
      - recetario_net
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recetario-frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8500}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - recetario_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  recetario_net:
    name: recetario_net
    driver: bridge

volumes:
  recetario_pgdata:
    name: recetario_pgdata
  recetario_redisdata:
    name: recetario_redisdata
